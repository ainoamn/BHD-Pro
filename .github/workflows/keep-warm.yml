# Keep Render free-tier API awake (cold starts otherwise take 10–50s).
name: Keep warm API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://bhd-pro.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          curl -fsS --retry 2 --retry-delay 3 --max-time 30 "$URL"
          echo
          echo "OK"
