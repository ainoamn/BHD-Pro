# Keep Render free-tier API awake (cold starts otherwise take 10–50s).
# Also asserts /health/ready so DB/Redis/S3 misconfig fails the job.
name: Keep warm API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping liveness + readiness
        run: |
          chmod +x scripts/api-ready-smoke.sh
          URL="${{ secrets.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://hisaby-api.onrender.com/api/health"
          fi
          ./scripts/api-ready-smoke.sh "$URL"
