name: Keep API awake

# Render free tier sleeps after idle; ping health so /admin doesn't stall 20–40s.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Hisaby API
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 \
              "https://hisaby-api.onrender.com/api/health" || echo "000")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 8
          done
          echo "API did not respond 200 after retries"
          exit 0
