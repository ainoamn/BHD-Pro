# Staging smoke — run Playwright against a deployed URL (manual)
name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Frontend base URL (e.g. https://hisaby.pro or a Vercel preview)"
        required: true
        type: string

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright against staging URL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke e2e against URL
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
