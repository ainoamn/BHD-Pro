# Production stack for hisaby.pro
# Usage on server:
#   1. cp .env.production.example .env.production  (fill secrets)
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisaby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hisaby_pro
    volumes:
      - hisaby_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaby -d hisaby_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - hisaby_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /backend-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /backend-api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build: ./backend
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hisaby:${POSTGRES_PASSWORD}@db:5432/hisaby_pro?schema=public
      DIRECT_URL: postgresql://hisaby:${POSTGRES_PASSWORD}@db:5432/hisaby_pro?schema=public
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "src/prisma/schema.prisma"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hisaby:${POSTGRES_PASSWORD}@db:5432/hisaby_pro?schema=public
      DIRECT_URL: postgresql://hisaby:${POSTGRES_PASSWORD}@db:5432/hisaby_pro?schema=public
      CORS_ORIGIN: https://hisaby.pro
      FRONTEND_URL: https://hisaby.pro
      API_PUBLIC_URL: https://hisaby.pro
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional: put Caddy/Nginx in front for SSL — see deploy/nginx-hisaby.pro.conf
  # Or terminate SSL at Cloudflare / host load balancer and proxy to frontend:3000

volumes:
  hisaby_pg:
  hisaby_redis:
